name: Build

# Every push and pull request is type-checked and tested (including the branches
# Workshop's own agents push). The agent image is built and smoke-tested everywhere;
# images are only published from main.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: bash -n agent/entrypoint.sh

  agent-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: agent
          target: base
          load: true
          push: false
          tags: workshop-agent:ci
          cache-from: type=gha,scope=agent
      - uses: docker/build-push-action@v6
        with:
          context: agent
          target: browser
          load: true
          push: false
          tags: workshop-agent-browser:ci
          cache-from: type=gha,scope=agent
      # Runs as the unprivileged agent user, so this proves it can launch the browser.
      - name: Take a screenshot
        run: docker run --rm --entrypoint bash workshop-agent-browser:ci -c 'cd /tmp && playwright screenshot --full-page "data:text/html,<h1>hi</h1>" s.png && test -s s.png && node -e "require(\"playwright\")"'
      - name: Check the capabilities label
        run: test "$(docker image inspect workshop-agent-browser:ci --format '{{index .Config.Labels "workshop.capabilities"}}')" = browser
      - name: Check the base image has no browser
        run: |
          docker run --rm --entrypoint bash workshop-agent:ci -c '! command -v playwright'
          test -z "$(docker image inspect workshop-agent:ci --format '{{index .Config.Labels "workshop.capabilities"}}')"

  images:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # package.json's version is the manually bumped MAJOR.MINOR.PATCH; the run number
      # and short sha make each build's version unique without anyone bumping it.
      - name: Compute image name and app version
        id: meta
        run: |
          echo "image=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)+${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push the agent image
        uses: docker/build-push-action@v6
        with:
          context: agent
          target: base
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}-agent:latest
            ${{ steps.meta.outputs.image }}-agent:${{ github.sha }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Build and push the agent browser image
        uses: docker/build-push-action@v6
        with:
          context: agent
          target: browser
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}-agent-browser:latest
            ${{ steps.meta.outputs.image }}-agent-browser:${{ github.sha }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      # Each Workshop image pins the agent images from the same commit.
      - name: Build and push Workshop
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            AGENT_IMAGE=${{ steps.meta.outputs.image }}-agent:${{ github.sha }}
            AGENT_BROWSER_IMAGE=${{ steps.meta.outputs.image }}-agent-browser:${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=workshop
          cache-to: type=gha,mode=max,scope=workshop
